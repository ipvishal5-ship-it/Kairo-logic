<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
      text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </defs>

  <!-- 1. Canvas Background: Light Mint #EEF5F3 -->
  <rect width="1600" height="1000" fill="#EEF5F3" />

  <!-- 2. Rounded Outer White Card: 1504x904 (48px padding all sides), 1px border #D5E3E0 -->
  <rect x="48" y="48" width="1504" height="904" rx="32" fill="#FFFFFF" stroke="#D5E3E0" strokeWidth="1" />

  <!-- ══════════════════════════════════════════════════════════════════
       CARD 1 (X: 112, Y: 120, W: 400, H: 680): "1. Upload"
       ══════════════════════════════════════════════════════════════════ -->
  <g id="card-1">
    <!-- Card 1 Container: White with #D5E3E0 border -->
    <rect x="112" y="120" width="400" height="680" rx="24" fill="#FFFFFF" stroke="#D5E3E0" strokeWidth="2" />

    <!-- Card 1 Title -->
    <text x="144" y="174" fill="#0F3D3E" fontSize="28" fontWeight="700">1. Upload</text>

    <!-- Browser Window Mockup (336 x 350) -->
    <g transform="translate(144, 204)">
      <!-- Browser Outer Frame -->
      <rect width="336" height="350" rx="14" fill="#F8FBFA" stroke="#D5E3E0" strokeWidth="1.5" />
      
      <!-- Browser Header Bar -->
      <rect width="336" height="46" rx="14 14 0 0" fill="#EEF5F3" />
      <!-- Window Controls (3 dots) -->
      <circle cx="24" cy="23" r="5" fill="#FF5F56" />
      <circle cx="40" cy="23" r="5" fill="#FFBD2E" />
      <circle cx="56" cy="23" r="5" fill="#27C93F" />
      <!-- URL Bar -->
      <rect x="74" y="9" width="246" height="28" rx="6" fill="#FFFFFF" stroke="#D5E3E0" strokeWidth="1" />
      <text x="88" y="28" fill="#0F3D3E" fontSize="18" fontWeight="600">app.kairologic.com</text>

      <!-- Dashed Drop Zone (288 x 260) -->
      <rect x="24" y="66" width="288" height="260" rx="12" fill="#FFFFFF" stroke="#1FB58F" strokeWidth="2" strokeDasharray="8 6" />
      
      <!-- PDF Document Icon (48 x 58) -->
      <g transform="translate(144, 106)">
        <path d="M 0 0 L 32 0 L 48 16 L 48 58 L 0 58 Z" fill="#EEF5F3" stroke="#0F3D3E" strokeWidth="2" strokeLinejoin="round" />
        <path d="M 32 0 L 32 16 L 48 16 Z" fill="#A8E6CF" stroke="#0F3D3E" strokeWidth="2" strokeLinejoin="round" />
        <rect x="6" y="24" width="36" height="18" rx="3" fill="#0F3D3E" />
        <text x="24" y="37" fill="#FFFFFF" fontSize="14" fontWeight="800" textAnchor="middle">PDF</text>
      </g>

      <!-- Filename Text -->
      <text x="168" y="206" fill="#0F3D3E" fontSize="20" fontWeight="700" textAnchor="middle">OriginalSuit_8472.pdf</text>
      <text x="168" y="238" fill="#0F3D3E" opacity="0.65" fontSize="18" fontWeight="500" textAnchor="middle">Drop file here</text>

      <!-- Ready Status Badge -->
      <rect x="94" y="264" width="148" height="34" rx="17" fill="#EEF5F3" />
      <circle cx="112" cy="281" r="5" fill="#1FB58F" />
      <text x="124" y="287" fill="#0F3D3E" fontSize="18" fontWeight="600">Ready</text>
    </g>

    <!-- Bottom "Any Device" Section -->
    <g transform="translate(144, 594)">
      <line x1="0" y1="0" x2="336" y2="0" stroke="#D5E3E0" strokeWidth="1" />
      
      <!-- 3 Small Device Icons: Laptop, PC, Tablet -->
      <g transform="translate(36, 32)">
        <!-- Laptop -->
        <g transform="translate(0, 0)">
          <rect x="4" y="0" width="46" height="30" rx="3" fill="#EEF5F3" stroke="#0F3D3E" strokeWidth="2" />
          <line x1="0" y1="30" x2="54" y2="30" stroke="#0F3D3E" strokeWidth="3" strokeLinecap="round" />
        </g>
        <!-- Windows PC -->
        <g transform="translate(105, 0)">
          <rect x="4" y="0" width="46" height="30" rx="3" fill="#EEF5F3" stroke="#0F3D3E" strokeWidth="2" />
          <line x1="27" y1="30" x2="27" y2="35" stroke="#0F3D3E" strokeWidth="2.5" />
          <line x1="15" y1="35" x2="39" y2="35" stroke="#0F3D3E" strokeWidth="2.5" strokeLinecap="round" />
        </g>
        <!-- Tablet (iPad) -->
        <g transform="translate(210, 0)">
          <rect x="8" y="0" width="34" height="34" rx="4" fill="#EEF5F3" stroke="#0F3D3E" strokeWidth="2" />
          <circle cx="25" cy="28" r="2" fill="#0F3D3E" />
        </g>
      </g>

      <!-- Caption: "Any device" -->
      <text x="168" y="120" fill="#0F3D3E" fontSize="20" fontWeight="600" textAnchor="middle">Any device</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════
       CONNECTOR ARROW 1: Card 1 -> Card 2
       Strictly straight horizontal 4px solid line #0F3D3E with filled triangle head.
       Touches Card 1 right edge (X: 512) and Card 2 left edge (X: 592).
       Vertically centered on cards at Y: 460.
       ══════════════════════════════════════════════════════════════════ -->
  <line x1="512" y1="460" x2="578" y2="460" stroke="#0F3D3E" strokeWidth="4" />
  <polygon points="576,453 592,460 576,467" fill="#0F3D3E" />

  <!-- ══════════════════════════════════════════════════════════════════
       CARD 2 (X: 592, Y: 120, W: 400, H: 680): "2. Cloud processing"
       ══════════════════════════════════════════════════════════════════ -->
  <g id="card-2">
    <!-- Card 2 Container: Dark Teal #0F3D3E -->
    <rect x="592" y="120" width="400" height="680" rx="24" fill="#0F3D3E" />

    <!-- Card 2 Title: White -->
    <text x="792" y="174" fill="#FFFFFF" fontSize="28" fontWeight="700" textAnchor="middle">2. Cloud processing</text>

    <!-- Large Cloud Icon at the top, alone, with NO text on or behind it -->
    <g transform="translate(732, 214)">
      <path d="M 32 72 
               A 26 26 0 0 1 28 20 
               A 42 42 0 0 1 106 14 
               A 32 32 0 0 1 138 58 
               A 22 22 0 0 1 126 84 
               L 32 84 
               A 18 18 0 0 1 32 72 Z" 
            fill="#12494A" stroke="#A8E6CF" strokeWidth="3" strokeLinejoin="round" />
      <circle cx="72" cy="52" r="16" fill="#A8E6CF" fillOpacity="0.2" stroke="#A8E6CF" strokeWidth="2" />
      <circle cx="72" cy="52" r="6" fill="#1FB58F" />
    </g>

    <!-- Checklist of 4 items below the cloud icon with green check marks -->
    <g transform="translate(628, 344)">
      <!-- Line 1: Selective OCR -->
      <g transform="translate(0, 0)">
        <circle cx="20" cy="20" r="16" fill="#12494A" />
        <path d="M 12 20 L 18 26 L 28 14" fill="none" stroke="#1FB58F" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
        <text x="52" y="27" fill="#FFFFFF" fontSize="20" fontWeight="600">Selective OCR</text>
      </g>

      <!-- Line 2: 300 DPI conversion -->
      <g transform="translate(0, 68)">
        <circle cx="20" cy="20" r="16" fill="#12494A" />
        <path d="M 12 20 L 18 26 L 28 14" fill="none" stroke="#1FB58F" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
        <text x="52" y="27" fill="#FFFFFF" fontSize="20" fontWeight="600">300 DPI conversion</text>
      </g>

      <!-- Line 3: Pagination + Bates numbers -->
      <g transform="translate(0, 136)">
        <circle cx="20" cy="20" r="16" fill="#12494A" />
        <path d="M 12 20 L 18 26 L 28 14" fill="none" stroke="#1FB58F" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
        <text x="52" y="27" fill="#FFFFFF" fontSize="20" fontWeight="600">Pagination + Bates numbers</text>
      </g>

      <!-- Line 4: Digital + bank seal -->
      <g transform="translate(0, 204)">
        <circle cx="20" cy="20" r="16" fill="#12494A" />
        <path d="M 12 20 L 18 26 L 28 14" fill="none" stroke="#1FB58F" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
        <text x="52" y="27" fill="#FFFFFF" fontSize="20" fontWeight="600">Digital + bank seal</text>
      </g>
    </g>

    <!-- Bottom Line Container: 142 pages | 186 MB -> 94 MB -->
    <g transform="translate(624, 694)">
      <rect width="336" height="66" rx="16" fill="#12494A" stroke="#1FB58F" strokeWidth="1.5" />
      <text x="168" y="41" fill="#FFFFFF" fontSize="20" fontWeight="700" textAnchor="middle">142 pages | 186 MB -&gt; 94 MB</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════
       CONNECTOR ARROW 2: Card 2 -> Card 3
       Strictly straight horizontal 4px solid line #0F3D3E with filled triangle head.
       Touches Card 2 right edge (X: 992) and Card 3 left edge (X: 1072).
       Vertically centered on cards at Y: 460.
       ══════════════════════════════════════════════════════════════════ -->
  <line x1="992" y1="460" x2="1058" y2="460" stroke="#0F3D3E" strokeWidth="4" />
  <polygon points="1056,453 1072,460 1056,467" fill="#0F3D3E" />

  <!-- ══════════════════════════════════════════════════════════════════
       CARD 3 (X: 1072, Y: 120, W: 400, H: 680): "3. Portal-ready split"
       ══════════════════════════════════════════════════════════════════ -->
  <g id="card-3">
    <!-- Card 3 Container: White with #D5E3E0 border -->
    <rect x="1072" y="120" width="400" height="680" rx="24" fill="#FFFFFF" stroke="#D5E3E0" strokeWidth="2" />

    <!-- Card 3 Title -->
    <text x="1104" y="174" fill="#0F3D3E" fontSize="28" fontWeight="700">3. Portal-ready split</text>

    <!-- Two Stacked Document Tiles -->
    <g transform="translate(1104, 214)">
      <!-- Tile 1: Part 01 | 48 MB | Pages 1-64 -->
      <g transform="translate(0, 0)">
        <rect width="336" height="136" rx="16" fill="#F8FBFA" stroke="#D5E3E0" strokeWidth="1.5" />
        <rect x="0" y="0" width="10" height="136" rx="16 0 0 16" fill="#1FB58F" />
        
        <!-- Doc Icon -->
        <g transform="translate(24, 24)">
          <path d="M 0 0 L 20 0 L 30 10 L 30 36 L 0 36 Z" fill="#EEF5F3" stroke="#0F3D3E" strokeWidth="1.8" />
          <path d="M 20 0 L 20 10 L 30 10 Z" fill="#A8E6CF" stroke="#0F3D3E" strokeWidth="1.8" />
        </g>
        
        <text x="68" y="48" fill="#0F3D3E" fontSize="22" fontWeight="700">Part 01 | 48 MB</text>
        <text x="24" y="98" fill="#0F3D3E" fontSize="20" fontWeight="600">Pages 1-64</text>
      </g>

      <!-- Tile 2: Part 02 | 46 MB | Pages 65-142 -->
      <g transform="translate(0, 164)">
        <rect width="336" height="136" rx="16" fill="#F8FBFA" stroke="#D5E3E0" strokeWidth="1.5" />
        <rect x="0" y="0" width="10" height="136" rx="16 0 0 16" fill="#1FB58F" />
        
        <!-- Doc Icon -->
        <g transform="translate(24, 24)">
          <path d="M 0 0 L 20 0 L 30 10 L 30 36 L 0 36 Z" fill="#EEF5F3" stroke="#0F3D3E" strokeWidth="1.8" />
          <path d="M 20 0 L 20 10 L 30 10 Z" fill="#A8E6CF" stroke="#0F3D3E" strokeWidth="1.8" />
        </g>
        
        <text x="68" y="48" fill="#0F3D3E" fontSize="22" fontWeight="700">Part 02 | 46 MB</text>
        <text x="24" y="98" fill="#0F3D3E" fontSize="20" fontWeight="600">Pages 65-142</text>
      </g>
    </g>

    <!-- Green Badge: "Under 50 MB limit" -->
    <g transform="translate(1104, 550)">
      <rect width="336" height="54" rx="27" fill="#A8E6CF" />
      <circle cx="36" cy="27" r="13" fill="#1FB58F" />
      <path d="M 30 27 L 34 31 L 42 23" fill="none" stroke="#FFFFFF" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      <text x="62" y="34" fill="#0F3D3E" fontSize="20" fontWeight="700">Under 50 MB limit</text>
    </g>

    <!-- Dark Teal Button: "Export Verified Dossiers" -->
    <g transform="translate(1104, 630)">
      <rect width="336" height="66" rx="20" fill="#0F3D3E" />
      <circle cx="44" cy="33" r="14" fill="#12494A" />
      <path d="M 37 33 L 42 38 L 51 28" fill="none" stroke="#1FB58F" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      <text x="70" y="40" fill="#FFFFFF" fontSize="20" fontWeight="700">Export Verified Dossiers</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════
       BOTTOM: One slim dark pill, centered
       "Zero installation. Works on Windows, Mac and iPad."
       ══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(470, 848)">
    <rect width="660" height="52" rx="26" fill="#0F3D3E" />
    <circle cx="32" cy="26" r="6" fill="#1FB58F" />
    <text x="50" y="33" fill="#FFFFFF" fontSize="20" fontWeight="600">Zero installation. Works on Windows, Mac and iPad.</text>
  </g>
</svg>
